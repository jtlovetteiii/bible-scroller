[project]
name = "email-agent"
version = "0.1.0"
description = "Email-driven slide-deck agent for Scripture Scroller"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "claude-agent-sdk>=0.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# Console scripts exist so the systemd unit can name an absolute path
# (agent/.venv/bin/email-agent-heartbeat) instead of wrapping `uv run python -m
# ...` — one fewer moving part in the ExecStart line, and no dependency on uv
# resolving a lockfile at service-start time. See scripts/install-agent-host.sh.
email-agent-heartbeat = "email_agent.heartbeat:main"
email-agent-healthcheck = "email_agent.healthcheck:main"
# Gmail consent is a human act in a browser, run once by hand. It is NOT wired to
# a unit and must never be: the service cannot answer an OAuth prompt.
email-agent-authorize = "email_agent.authorize:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Evals run the real model against the real skill: minutes, and real tokens. They
# are opt-in (`uv run pytest -m eval`) so the fast suite stays fast and offline.
addopts = "-m 'not eval'"
markers = [
    "eval: exercises the model end to end (slow, costs tokens, needs auth)",
]
